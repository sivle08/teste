<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Python IDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Basic Python IDE</h1>

    <div>
        <label for="codeInput">Enter Python Code:</label>
        <textarea id="codeInput" rows="10" style="width: 90%;"></textarea>
    </div>

    <button id="runButton">Run Code</button>

    <div>
        <label for="outputArea">Output:</label>
        <pre id="outputArea" style="background-color: #f0f0f0; border: 1px solid #ccc; padding: 10px; min-height: 50px;"></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
