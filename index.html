<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Python IDE</title>
    <link rel="stylesheet" href="style.css">

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-darker.min.css">

</head>
<body>
    <h1>Advanced Python IDE</h1>

    <div>
        <label for="codeInput">Enter Python Code:</label>
        <!-- Textarea that CodeMirror will replace -->
        <textarea id="codeInput"></textarea>
    </div>

    <button id="runButton">Run Code</button>

    <div>
        <label for="outputArea">Output:</label>
        <pre id="outputArea" style="background-color: #f0f0f0; border: 1px solid #ccc; padding: 10px; min-height: 50px;"></pre>
    </div>

    <!-- CodeMirror JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>

    <!-- Initialize CodeMirror -->
    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("codeInput"), {
            lineNumbers: true,
            mode: "python",
            theme: "material-darker", // Using a dark theme
            indentUnit: 4,
            smartIndent: true,
            tabSize: 4,
            lineWrapping: true
        });
        // Set an initial size for the editor
        editor.setSize("100%", "300px");
    </script>

    <script src="script.js"></script>
</body>
</html>
